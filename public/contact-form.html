<!doctype html>
<html lang="he" dir="rtl">
  <head><meta charset="utf-8" /><title>Contact form registration</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <select name="service">
        <option value="ספר תורה">ספר תורה</option>
        <option value="תפילין">תפילין</option>
        <option value="מזוזות">מזוזות</option>
        <option value="בדיקת מזוזות ותפילין">בדיקת מזוזות ותפילין</option>
        <option value="אחר">אחר</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
